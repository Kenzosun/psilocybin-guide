<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>純度檢測試劑 - 完整操作教學指南</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>@property --k{syntax:'<color>';inherits:true;initial-value:#a855f7}
:root{--k:#a855f7;--n:var(--k);--bg:#000;--ink:#f5f5f7;--ink2:rgba(235,235,245,.72);--ink3:rgba(235,235,245,.48);--hair:rgba(255,255,255,.09);--hair2:rgba(255,255,255,.14);--glass:rgba(28,28,32,.55);--glass2:rgba(44,44,50,.5);--red:#ff453a;--cyan:#64d2ff;--green:#30d158;
--font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Noto Sans TC","PingFang TC",sans-serif;--mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
--spring:linear(0,.009,.035 2.1%,.141 4.4%,.723 12.9%,.938 16.7%,1.017 19.4%,1.067,1.099 24.3%,1.104 26%,1.098,1.077 30.6%,1.021 37.1%,.998 41.4%,.989 45.3%,.993 54.7%,1.001 64.5%,1);--ease:cubic-bezier(.22,1,.36,1);--ease-io:cubic-bezier(.65,0,.35,1);--r1:12px;--r2:20px;--r3:28px;transition:--k .9s var(--ease)}
*{margin:0;padding:0;box-sizing:border-box}
html{background:#000;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{font-family:var(--font);color:var(--ink);font-size:17px;line-height:1.6;letter-spacing:-.01em;min-height:100vh;overflow-x:hidden;background:#000}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:90vh;z-index:0;pointer-events:none;background:radial-gradient(50% 60% at 50% 0%,color-mix(in srgb,var(--k) 32%,transparent),transparent 70%),radial-gradient(30% 40% at 85% 20%,color-mix(in srgb,var(--k) 14%,transparent),transparent 70%);filter:blur(20px);opacity:.9}
.grid-bg,.noise,.crt-overlay,.scanline,.chroma,.img-corner,.swipe-hint,.tasks-dot{display:none!important}
.container{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:24px 16px 48px}
button{font-family:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid color-mix(in srgb,var(--k) 80%,#fff);outline-offset:3px}
/* glass */
.hud{position:relative;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(30px);backdrop-filter:saturate(180%) blur(30px);border:1px solid var(--hair);border-radius:var(--r3);box-shadow:0 1px 0 rgba(255,255,255,.06) inset,0 24px 64px -24px rgba(0,0,0,.8)}
/* segmented control */
nav{display:flex;justify-content:center;margin:0 0 40px;padding:0}
#navButtons{display:inline-flex!important;position:relative;gap:0;padding:4px;border-radius:999px;background:rgba(118,118,128,.24);border:1px solid var(--hair);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);max-width:100%;overflow-x:auto;scrollbar-width:none}
.kit-tab{position:relative;z-index:1;flex:0 0 auto;border:0;background:transparent;color:var(--ink2);font-size:14px;font-weight:600;letter-spacing:-.005em;padding:8px 16px;min-height:36px;border-radius:999px;cursor:pointer;transition:color .3s var(--ease)}
.kit-tab:hover{color:var(--ink)}
.kit-tab.active{color:#fff}
.seg-thumb{position:absolute;z-index:0;top:4px;bottom:4px;left:0;border-radius:999px;background:rgba(255,255,255,.16);box-shadow:0 3px 8px rgba(0,0,0,.35),0 0 0 .5px rgba(255,255,255,.12) inset;transition:transform .55s var(--spring),width .55s var(--spring)}
/* header */
header#header{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:40px;padding:0}
.header-left{display:flex;flex-direction:column;align-items:center;gap:8px}
.zap-icon{width:28px;height:28px;filter:drop-shadow(0 0 12px var(--k))}
.zap-icon path{stroke:var(--k)}
h1.glitch-text{font-family:var(--disp);font-weight:700;font-size:clamp(40px,9vw,80px);line-height:1.04;letter-spacing:-.035em;background:linear-gradient(180deg,#fff 30%,color-mix(in srgb,var(--k) 55%,#fff));-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-word}
h1.glitch-text::before,h1.glitch-text::after{display:none}
.header-subtitle{font-size:clamp(15px,2.2vw,19px);font-weight:500;color:var(--ink2);letter-spacing:-.01em;margin-top:4px}
.header-right{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink3)}
.header-right>*{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--hair)}
.status-label{border-right:0!important;border-radius:999px 0 0 999px!important;margin-right:-9px;padding-right:4px!important}
.status-online{border-left:0!important;border-radius:0 999px 999px 0!important;font-weight:600;padding-left:4px!important}
.status-online::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.step-counter{font-variant-numeric:tabular-nums;color:var(--ink)}
.ring{padding-left:4px!important}
.ring svg{width:22px;height:22px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:rgba(255,255,255,.14)}
.ring .fg{stroke:var(--k);stroke-linecap:round;stroke-dasharray:100;transition:stroke-dashoffset 1s var(--spring)}
.ring-num{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600;min-width:2.6em}
/* progress */
.rail{position:relative;margin:0 auto 24px;max-width:720px;padding:0}
.rail-track{height:3px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin:0 0 16px}
.rail-fill{height:100%;width:100%!important;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--n) 60%,#fff),var(--n));transform-origin:0 50%;transform:scaleX(var(--p,0));transition:transform .8s var(--spring);box-shadow:0 0 12px var(--n)}
.step-nav{display:flex;justify-content:center;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px}
.step-dot{position:relative;flex:0 0 auto;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:var(--ink3);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;transition:transform .5s var(--spring),background .3s,color .3s,box-shadow .3s}
.step-dot:hover{background:rgba(255,255,255,.12);color:var(--ink);transform:scale(1.08)}
.step-dot.done{color:var(--ink2);background:rgba(255,255,255,.1)}
.step-dot.active{background:var(--n);color:#000;transform:scale(1.12);box-shadow:0 0 0 4px color-mix(in srgb,var(--n) 22%,transparent),0 0 20px color-mix(in srgb,var(--n) 50%,transparent)}
.step-dot.danger:not(.active){color:var(--red)}
.step-dot.has-done::after{content:"";position:absolute;right:0;top:0;width:8px;height:8px;border-radius:50%;background:var(--green);border:2px solid #000}
/* card */
.cyber-border{--n:var(--neon-color);overflow:hidden;margin-bottom:24px}
.cyber-border::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(80% 60% at 0% 0%,color-mix(in srgb,var(--n) 14%,transparent),transparent 60%)}
.topbar{position:relative;z-index:1;display:flex;justify-content:space-between;padding:16px 24px 0;font-size:12px;font-weight:500;color:var(--ink3);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.topbar b{color:var(--n);font-weight:600}
.glow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(500px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.05),transparent 60%)}
.hud:hover>.glow{opacity:1}
.content-grid{position:relative;z-index:1;display:grid}
.image-section{padding:16px 16px 0}
.image-display{position:relative;width:100%;height:clamp(240px,62vw,420px);display:grid;place-items:center;border-radius:var(--r2);background:radial-gradient(60% 60% at 50% 50%,color-mix(in srgb,var(--n) 14%,#1c1c1e),#111113);overflow:hidden;box-shadow:0 0 0 1px var(--hair) inset}
.image-display img{max-width:80%;max-height:80%;min-width:50%;object-fit:contain;border-radius:14px;cursor:zoom-in;box-shadow:0 20px 40px -12px rgba(0,0,0,.7);transition:transform .6s var(--spring)}
.image-display img:hover{transform:scale(1.03)}
.image-tabs{display:flex;justify-content:center;gap:8px;margin-top:16px}
.image-tab-btn{width:8px;height:8px;min-width:0;padding:0;border:0;border-radius:99px;background:rgba(255,255,255,.25);font-size:0;cursor:pointer;transition:width .5s var(--spring),background .3s;position:relative}
.image-tab-btn::before{content:"";position:absolute;inset:-12px}
.image-tab-btn.active{width:24px;background:#fff}
.text-section{padding:24px}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.icon-box{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;color:var(--n);background:color-mix(in srgb,var(--n) 16%,transparent)}
.icon-box svg{width:20px;height:20px}
.section-label{font-size:13px;font-weight:600;color:var(--n);letter-spacing:0}
.text-section h2{font-family:var(--disp);font-size:clamp(28px,4.4vw,40px);line-height:1.12;font-weight:700;letter-spacing:-.025em;margin-bottom:16px}
.description{font-size:17px;color:var(--ink2);margin-bottom:24px;line-height:1.65}
.danger .description{color:#ffd6d3;background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.28);padding:16px;border-radius:16px;font-weight:500}
.tasks-box{background:none;border:0;padding:0}
.tasks-header{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink3);margin:0 0 8px 4px;letter-spacing:.01em}
.tasks-header small{font-size:12px;font-weight:500;color:var(--ink3)}
.tasks-list{list-style:none;border-radius:16px;background:rgba(118,118,128,.12);border:1px solid var(--hair);overflow:hidden}
.task-item{position:relative;display:grid;grid-template-columns:auto auto 1fr;gap:12px;align-items:start;padding:14px 16px;cursor:pointer;user-select:none;transition:background .25s}
.task-item+.task-item::before{content:"";position:absolute;top:0;left:56px;right:0;height:1px;background:var(--hair)}
.task-item:hover{background:rgba(255,255,255,.04)}
.task-item:active{background:rgba(255,255,255,.07)}
.task-item:focus-visible{outline-offset:-2px;border-radius:16px}
.tick{width:24px;height:24px;margin-top:1px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.28);transition:background .3s var(--ease),border-color .3s,transform .5s var(--spring)}
.tick svg{width:13px;height:13px;stroke:#000;stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .4s var(--ease) .08s}
.task-item.checked .tick{background:var(--n);border-color:var(--n)}
.task-item.checked .tick svg{stroke-dashoffset:0}
.task-item.pop .tick{animation:pop .6s var(--spring)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.task-idx{font-size:13px;font-weight:600;color:var(--ink3);padding-top:2px;font-variant-numeric:tabular-nums;min-width:1.6em}
.task-idx{font-size:0}.task-idx::after{content:attr(data-n);font-size:13px}
.task-text{color:var(--ink);transition:color .3s}
.task-item.checked .task-text{color:var(--ink3)}
.tip-box{margin-top:24px;padding:16px 16px 16px 20px;border-radius:16px;background:linear-gradient(135deg,rgba(100,210,255,.12),rgba(48,209,88,.06));border:1px solid rgba(100,210,255,.22)}
.tip-header{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--cyan);margin-bottom:4px}
.tip-icon{width:15px;height:15px;stroke-width:2.2}
.tip-text{color:var(--ink2);font-size:16px}
/* nav */
.nav-buttons-container{display:flex;justify-content:space-between;gap:12px;margin:0 0 64px}
.nav-buttons-container button{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:48px;padding:0 24px;border-radius:999px;font-size:17px;font-weight:600;cursor:pointer;border:0;transition:transform .5s var(--spring),background .3s,opacity .3s;flex:1}
.prev-btn{color:var(--ink);background:rgba(255,255,255,.1)}
.prev-btn:hover:not(:disabled){background:rgba(255,255,255,.16)}
.next-btn{color:#000;background:var(--n)!important;box-shadow:0 8px 24px -8px var(--n)!important}
.nav-buttons-container button:active:not(:disabled){transform:scale(.96)}
.nav-buttons-container button:disabled{opacity:.3;cursor:default;background:rgba(255,255,255,.08)!important;color:var(--ink2);box-shadow:none!important}
.chevron-icon{width:18px;height:18px;stroke-width:2.5}
/* info */
.info-cards{display:grid;gap:16px}
.info-card{padding:24px;border-radius:var(--r3)}
.info-card h4{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:700;letter-spacing:-.015em;margin-bottom:12px}
.info-card h4 .tag{display:none}
.info-card-icon{width:22px;height:22px;color:var(--cyan)}
.info-card p{color:var(--ink2)}
.info-card.warnings{background:linear-gradient(160deg,rgba(255,69,58,.14),rgba(28,28,32,.55) 60%);border-color:rgba(255,69,58,.24)}
.info-card.warnings .info-card-icon{color:var(--red)}
.warnings-list{list-style:none;display:flex;flex-direction:column;gap:12px}
.warning-item{display:flex;gap:12px;color:var(--ink2)}
.warning-icon{width:18px;height:18px;flex:none;margin-top:4px;color:var(--red);stroke-width:2}
footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink3);text-align:center}
footer .aes{font-size:11px;letter-spacing:.04em;opacity:.7}
/* motion */
.tilt{transform:perspective(1600px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .8s var(--ease)}
.cyber-border.enter{animation:inR .8s var(--spring) both}
.cyber-border.enter.prev{animation-name:inL}
@keyframes inR{from{opacity:0;transform:translateX(64px) scale(.98)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-64px) scale(.98)}to{opacity:1;transform:none}}
.enter .text-section>*{animation:up .7s var(--ease) both}
.enter .text-section>*:nth-child(2){animation-delay:.05s}.enter .text-section>*:nth-child(3){animation-delay:.1s}.enter .text-section>*:nth-child(4){animation-delay:.15s}.enter .text-section>*:nth-child(5){animation-delay:.2s}
.enter .task-item{animation:up .6s var(--ease) both;animation-delay:calc(.18s + var(--i) * 40ms)}
.enter .image-display img{animation:imgin .9s var(--spring) both}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes imgin{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.stagger{animation:up .9s var(--ease) both;animation-delay:calc(var(--d,0) * 80ms)}
.reveal{opacity:0;transform:translateY(32px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}
.morph{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(50% 40% at 50% 0%,var(--k),transparent 70%);opacity:0}
.morph.go{animation:morph 1.1s var(--ease)}
@keyframes morph{30%{opacity:.25}100%{opacity:0}}
.magnetic{transition:transform .5s var(--spring)}
.ripple-host{position:relative;overflow:hidden}
.ripple{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.35);animation:rip .7s var(--ease) forwards}
@keyframes rip{from{transform:scale(0);opacity:.6}to{transform:scale(24);opacity:0}}
/* boot */
#boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#000;transition:opacity .6s var(--ease)}
#boot.out{opacity:0;pointer-events:none}
.boot-box{display:flex;flex-direction:column;align-items:center;gap:16px}
.boot-mark{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--k) 85%,#fff),color-mix(in srgb,var(--k) 60%,#000));box-shadow:0 0 60px -6px var(--k);animation:mark 1s var(--spring) both}
.boot-mark svg{width:30px;height:30px}
@keyframes mark{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.boot-logo{font:700 28px var(--disp);letter-spacing:-.02em;color:#fff;background:linear-gradient(90deg,#fff 0 40%,rgba(255,255,255,.35) 50%,#fff 60%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fadeup .8s var(--ease) .2s both,shine 1.4s var(--ease) .4s both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shine{from{background-position:100% 0}to{background-position:0 0}}
.boot-sub{font-size:13px;color:var(--ink3);animation:fadeup .8s var(--ease) .45s both}
.boot-skip{position:fixed;bottom:32px;font-size:12px;color:var(--ink3);opacity:.6}
/* lightbox */
#lb{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(40px) saturate(150%);backdrop-filter:blur(40px) saturate(150%);opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
#lb.open{opacity:1;pointer-events:auto}
#lb figure{position:relative;max-width:90vw;max-height:84vh;border-radius:var(--r3);overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,.6);transform:scale(.9);transition:transform .6s var(--spring)}
#lb.open figure{transform:none}
#lb img{display:block;max-width:90vw;max-height:84vh;background:#1c1c1e;cursor:zoom-in;transition:transform .6s var(--spring)}
#lb.zoom img{transform:scale(2.2);cursor:zoom-out}
#lb figcaption{position:absolute;left:0;right:0;bottom:0;padding:16px;font-size:14px;font-weight:500;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
#lb .x{position:absolute;top:24px;right:24px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:16px;cursor:pointer;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
/* layout */
@media(min-width:780px){.container{padding:48px 32px 80px}nav{margin-bottom:64px}header#header{margin-bottom:56px}.content-grid.has-image{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}.has-image .image-section{padding:24px 0 24px 24px;position:sticky;top:24px}.image-display{height:440px}.text-section{padding:32px 40px 40px}.topbar{padding:20px 32px 0}.info-cards{grid-template-columns:1fr 1fr}.nav-buttons-container{max-width:480px;margin:0 auto 80px}.step-dot{width:36px;height:36px}}
@media(max-width:779px){body{font-size:16px}.nav-buttons-container{position:sticky;bottom:0;z-index:20;margin:0 -16px 40px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(0,0,0,.55);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border-top:1px solid var(--hair)}.step-nav{justify-content:flex-start}.header-right{font-size:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}#boot{display:none}.reveal{opacity:1;transform:none}.tilt{transform:none!important}}
.print-all{display:none}
@media print{#boot,#lb,.morph,.glow,.tick,nav,.rail,.nav-buttons-container,#main,#infoCards{display:none!important}body::before{display:none}html,body{background:#fff}body{color:#000;font-size:11pt}*{color:#000!important;background:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}h1.glitch-text{-webkit-text-fill-color:#000;font-size:28pt}.print-all{display:block}.hud{border:1px solid #bbb!important;break-inside:avoid;margin-bottom:12px}.print-kit{break-before:page}.print-kit:first-child{break-before:auto}.image-display{height:auto;max-height:180px}.image-display img{max-height:170px;box-shadow:none}.tasks-list{border:1px solid #ccc}}
.cyber-border,.rail,.nav-buttons-container{--n:var(--k)!important}
.cyber-border.danger{--n:#ff453a!important}
.icon-box{color:var(--neon-color,var(--n));background:color-mix(in srgb,var(--neon-color,var(--n)) 16%,transparent)}
@media(max-width:779px){.kit-tab{padding:8px 12px;font-size:13px}}
/* ===== v4 psychedelic layer ===== */
:root{--mag:#ff2bd6;--acid:#b6ff3b;--elec:#2de2ff;--vio:#8b5cff;--org:#ff8a2b;--holo:conic-gradient(from var(--ha,0deg) at var(--mx,50%) var(--my,50%),#ff2bd6,#ff8a2b,#b6ff3b,#2de2ff,#8b5cff,#ff2bd6);--glass:rgba(10,8,22,.66)}
@property --ha{syntax:'<angle>';inherits:true;initial-value:0deg}
@keyframes hue{to{--ha:360deg}}
body{background:#030208}
body::before{display:none}
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;display:block;background:radial-gradient(60% 50% at 30% 20%,rgba(255,43,214,.35),transparent),radial-gradient(50% 50% at 80% 70%,rgba(45,226,255,.3),transparent),#05030c}
body::after{content:"";position:fixed;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
.container{z-index:3}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 40%,transparent 40%,rgba(0,0,0,.65))}
/* headings */
h1.glitch-text{background:linear-gradient(90deg,#fff,#ff9bf0,#ffd08a,#d9ff9a,#9ff2ff,#c9b6ff,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 8s linear infinite;filter:drop-shadow(-2px 0 0 rgba(255,43,214,.55)) drop-shadow(2px 0 0 rgba(45,226,255,.55)) drop-shadow(0 0 24px rgba(139,92,255,.45))}
@keyframes flow{to{background-position:300% 0}}
.header-subtitle{color:rgba(240,235,255,.82)}
.zap-icon{filter:drop-shadow(0 0 10px var(--mag)) drop-shadow(0 0 20px var(--elec))}
/* glass panels with holo foil */
.hud{background:var(--glass);border:1px solid transparent;background-clip:padding-box;isolation:isolate}
.hud>.holo-edge{position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;z-index:3;background:var(--holo);animation:hue 10s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}
.hud>.foil{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;background:var(--holo);mix-blend-mode:color-dodge;opacity:.07;filter:blur(30px) saturate(1.4);animation:hue 14s linear infinite;transition:opacity .6s}
.hud:hover>.foil{opacity:.16}
.glow{background:radial-gradient(520px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.08),transparent 60%)}
.cyber-border::before{background:radial-gradient(70% 60% at 0% 0%,color-mix(in srgb,var(--k) 20%,transparent),transparent 60%),radial-gradient(60% 60% at 100% 100%,rgba(45,226,255,.10),transparent 60%);z-index:0}
.text-section h2{text-shadow:-1px 0 rgba(255,43,214,.35),1px 0 rgba(45,226,255,.35)}
.description,.tip-text,.info-card p,.warning-item{color:rgba(240,236,255,.86)}
.tasks-list{background:rgba(6,4,14,.55)}
.task-item.checked .tick{background:linear-gradient(135deg,var(--mag),var(--org));border-color:transparent;box-shadow:0 0 14px rgba(255,43,214,.6)}
.task-item.pop::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,43,214,.25),rgba(182,255,59,.2),rgba(45,226,255,.25),transparent);animation:sweep .7s var(--ease) forwards}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
/* rail + dots */
.rail-fill{background:linear-gradient(90deg,var(--mag),var(--org),var(--acid),var(--elec),var(--vio),var(--mag));background-size:200% 100%;animation:flow2 3s linear infinite;box-shadow:0 0 14px rgba(255,43,214,.7)}
@keyframes flow2{to{background-position:200% 0}}
.step-dot.active{background:conic-gradient(from var(--ha),var(--mag),var(--org),var(--acid),var(--elec),var(--vio),var(--mag));animation:hue 4s linear infinite;color:#000;box-shadow:0 0 0 4px rgba(255,255,255,.08),0 0 24px rgba(255,43,214,.6),0 0 40px rgba(45,226,255,.35)}
.step-dot.danger.active{background:radial-gradient(circle,#ff6b5e,#ff2b6a);animation:none}
.ring .fg{stroke:url(#ringgrad)}
/* buttons */
.next-btn{background:linear-gradient(110deg,var(--mag),var(--org) 40%,var(--acid) 70%,var(--elec))!important;background-size:220% 100%!important;animation:flow2 6s linear infinite;color:#0a0010!important;box-shadow:0 10px 30px -8px rgba(255,43,214,.7),0 0 0 1px rgba(255,255,255,.2) inset!important}
.danger~* .next-btn{}
#navButtons{background:rgba(10,8,22,.55)}
.seg-thumb{background:linear-gradient(135deg,rgba(255,43,214,.5),rgba(45,226,255,.45));box-shadow:0 0 18px rgba(255,43,214,.45)}
.tip-box{background:linear-gradient(135deg,rgba(45,226,255,.14),rgba(182,255,59,.08));border-color:rgba(45,226,255,.35);box-shadow:0 0 30px -10px rgba(45,226,255,.5)}
.tip-header{color:var(--elec)}
.danger .description{background:linear-gradient(135deg,rgba(255,43,106,.2),rgba(255,43,214,.12));border-color:rgba(255,80,120,.45);box-shadow:0 0 30px -10px rgba(255,43,106,.6)}
.info-card.warnings{background:linear-gradient(160deg,rgba(255,43,106,.2),rgba(10,8,22,.7) 60%)}
.image-display{background:radial-gradient(60% 60% at 50% 50%,color-mix(in srgb,var(--k) 22%,#0c0818),#07050f)}
.image-display:hover img{filter:url(#wobble) saturate(1.15)}
.topbar,.section-label,.tasks-header small{font-family:var(--mono);letter-spacing:.08em}
.topbar{text-transform:uppercase;font-size:11px}
/* wavy transition */
.cyber-border.enter{animation:inR .9s var(--spring) both}
@keyframes inR{from{opacity:0;transform:translateX(70px) scale(.97) skewX(-3deg)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-70px) scale(.97) skewX(3deg)}to{opacity:1;transform:none}}
.ripple{background:radial-gradient(circle,rgba(255,43,214,.6),rgba(45,226,255,.3) 50%,transparent 70%)}
/* intro */
#boot{background:rgba(3,2,8,.25)!important}
.boot-mark{background:conic-gradient(from var(--ha),var(--mag),var(--org),var(--acid),var(--elec),var(--vio),var(--mag));animation:mark 1.1s var(--spring) both,hue 3s linear infinite;box-shadow:0 0 60px rgba(255,43,214,.7),0 0 120px rgba(45,226,255,.4);border-radius:22px}
.boot-mark svg{stroke:#0a0010}
.boot-logo{font-size:44px;background:linear-gradient(90deg,#fff,#ff9bf0,#ffd08a,#d9ff9a,#9ff2ff,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:fadeup .9s var(--ease) .25s both,flow 3s linear infinite;filter:drop-shadow(-2px 0 rgba(255,43,214,.6)) drop-shadow(2px 0 rgba(45,226,255,.6))}
.boot-sub{color:rgba(240,235,255,.8)}
@media(prefers-reduced-motion:reduce){h1.glitch-text,.rail-fill,.next-btn,.step-dot.active,.hud>.foil,.hud>.holo-edge{animation:none!important}.image-display:hover img{filter:none}}
@media print{#fx,.vignette,.foil,.holo-edge,body::after{display:none!important}h1.glitch-text{filter:none}}
/* v5 fixed floating nav */
.nav-buttons-container{position:fixed!important;left:50%!important;right:auto!important;bottom:calc(16px + env(safe-area-inset-bottom))!important;top:auto!important;transform:translateX(-50%);z-index:40;width:min(480px,calc(100vw - 32px));max-width:none!important;margin:0!important;padding:8px!important;border-radius:999px;background:rgba(10,8,22,.55)!important;-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);border:1px solid transparent!important;box-shadow:0 20px 50px -12px rgba(0,0,0,.8),0 0 30px -8px rgba(255,43,214,.45)}
.nav-buttons-container::before{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;background:var(--holo);animation:hue 10s linear infinite;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.6}
.container{padding-bottom:calc(120px + env(safe-area-inset-bottom))!important}
.cyber-border{scroll-margin-top:16px}
@media print{.nav-buttons-container{display:none!important}}
</style>

          const a=document.querySelector('#main .step-dot.active');if(a){const nv=a.parentElement;nv.scrollTo({left:a.offsetLeft-nv.clientWidth/2+a.offsetWidth/2,behavior:RM?'auto':'smooth'})}
          holo();updateRing();markDots();animateCount();bindFX();seg();reveal();wave();window.FX&&FX.setKit(KITS[state.activeKit].themeColor)}
        function seg(){const nb=document.getElementById('navButtons');let t=nb.querySelector('.seg-thumb');if(!t){t=document.createElement('span');t.className='seg-thumb';nb.prepend(t)}const a=nb.querySelector('.kit-tab.active');if(a){t.style.width=a.offsetWidth+'px';t.style.transform=`translateX(${a.offsetLeft}px)`}}
        const io='IntersectionObserver' in window&&!RM?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -8% 0px'}):null;
        function reveal(){document.querySelectorAll('#infoCards .info-card,footer').forEach(el=>{if(!io||el._rv)return;el._rv=1;el.classList.add('reveal');io.observe(el)})}
        addEventListener('resize',()=>seg());
        function go(fn){fn();render();after();const c=document.querySelector('#main .cyber-border');if(c){const r=c.getBoundingClientRect();if(r.top<0||r.top>innerHeight*.5)c.scrollIntoView({block:'start',behavior:RM?'auto':'smooth'})}}
        function changeKit(id){if(id===state.activeKit)return;state={activeKit:id,activeStep:0,activeImageIndex:0,dir:'next'};ringVal=0;const m=document.querySelector('.morph');m.classList.remove('go');void m.offsetWidth;m.classList.add('go');render();after();
          document.querySelectorAll('#header,.info-card').forEach((e,i)=>{e.classList.remove('stagger');void e.offsetWidth;e.style.setProperty('--d',i);e.classList.add('stagger')})}
        function nextStep(){if(state.activeStep<KITS[state.activeKit].steps.length-1)go(()=>{state.activeStep++;state.activeImageIndex=0;state.dir='next'})}
        function prevStep(){if(state.activeStep>0)go(()=>{state.activeStep--;state.activeImageIndex=0;state.dir='prev'})}
        function goToStep(i){if(i!==state.activeStep)go(()=>{state.dir=i>state.activeStep?'next':'prev';state.activeStep=i;state.activeImageIndex=0})}
        function changeImage(i){const d=KITS[state.activeKit].steps[state.activeStep],im=d.images[i];state.activeImageIndex=i;
          const img=document.querySelector('#main .image-display img');img.src=im.src;img.alt=im.alt;img.dataset.lb=im.src;document.querySelector('#main .img-corner.tl').textContent='IMG_'+String.fromCharCode(65+i);document.querySelector('#main .img-corner.br').textContent=im.alt;
          img.style.animation='none';void img.offsetWidth;img.style.animation='imgin .6s var(--ease) both';
          document.querySelectorAll('#main .image-tab-btn').forEach((b,j)=>{b.classList.toggle('active',j===i);b.setAttribute('aria-pressed',j===i)})}
        // lightbox
        let lbReturn=null;
        function openLB(img){const lb=document.getElementById('lb');lb.querySelector('img').src=img.dataset.lb;lb.querySelector('img').alt=img.alt;lb.querySelector('figcaption').textContent=img.alt;lb.classList.remove('zoom');lb.classList.add('open');lb.setAttribute('aria-hidden','false');lbReturn=img;lb.querySelector('.x').focus()}
        function closeLB(){const lb=document.getElementById('lb');lb.classList.remove('open','zoom');lb.setAttribute('aria-hidden','true');lbReturn&&lbReturn.focus()}
        // FX: tilt, glow, magnetic, ripple
        const fine=matchMedia('(hover:hover) and (pointer:fine)').matches;
        function bindFX(){if(RM)return;
          document.querySelectorAll('.hud').forEach(c=>{if(c._fx)return;c._fx=1;c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%');if(fine&&c.classList.contains('tilt')){c.style.setProperty('--ry',((x-.5)*1.2)+'deg');c.style.setProperty('--rx',((.5-y)*1.2)+'deg')}});c.addEventListener('pointerleave',()=>{c.style.setProperty('--rx','0deg');c.style.setProperty('--ry','0deg')})});
          if(fine)document.querySelectorAll('.magnetic').forEach(b=>{if(b._mg)return;b._mg=1;b.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.06}px,${(e.clientY-r.top-r.height/2)*.12}px)`});b.addEventListener('pointerleave',()=>b.style.transform='')})}
        document.addEventListener('pointerdown',e=>{if(RM)return;const h=e.target.closest('.ripple-host,.kit-tab,.step-dot,.image-tab-btn,.task-item');if(!h)return;h.classList.add('ripple-host');const r=h.getBoundingClientRect(),s=document.createElement('span');s.className='ripple';s.style.left=e.clientX-r.left+'px';s.style.top=e.clientY-r.top+'px';h.appendChild(s);setTimeout(()=>s.remove(),650)});
        // swipe
        let sx=0,sy=0,st=0;const mainEl=document.getElementById('main');
        mainEl.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
        mainEl.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Date.now()-st<600&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?nextStep():prevStep()}},{passive:true});
        // keys
        document.addEventListener('keydown',e=>{const lb=document.getElementById('lb');if(lb.classList.contains('open')){if(e.key==='Escape')closeLB();return}
          if(document.getElementById('boot')&&!document.getElementById('boot').classList.contains('out')){endBoot();return}
          if(e.target.closest&&e.target.closest('.task-item'))return;if(e.key==='ArrowRight')nextStep();if(e.key==='ArrowLeft')prevStep()});
        // lightbox events
        (()=>{const lb=document.getElementById('lb');lb.querySelector('.x').onclick=closeLB;lb.onclick=e=>{if(e.target===lb)closeLB()};const img=lb.querySelector('img');
          img.onclick=e=>{const r=img.getBoundingClientRect();img.style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`;lb.classList.toggle('zoom')};
          img.onpointermove=e=>{if(!lb.classList.contains('zoom'))return;const r=lb.querySelector('figure').getBoundingClientRect();img.style.transformOrigin=`${(e.clientX-r.left)/r.width*100}% ${(e.clientY-r.top)/r.height*100}%`}})();
        // boot
        let booted=false;
        function endBoot(){if(booted)return;booted=true;window.FX&&FX.intro(false);document.body.classList.remove('booting');const b=document.getElementById('boot');b.classList.add('out');setTimeout(()=>b.remove(),700);
          ['nav','#header','#main .rail','#infoCards .info-card:nth-child(1)','#infoCards .info-card:nth-child(2)','footer'].forEach((q,i)=>{const e=document.querySelector(q);if(e&&!RM){e.style.setProperty('--d',i);e.classList.add('stagger')}});
          const c=document.querySelector('#main .cyber-border');if(c&&!RM){c.classList.remove('enter');void c.offsetWidth;c.classList.add('enter')}}
        // ===== v4 WebGL psychedelic background =====
        window.FX=(()=>{const c=document.getElementById('fx');let gl=null;try{gl=c.getContext('webgl',{antialias:false,alpha:false,powerPreference:'low-power'})}catch(e){}
          if(!gl)return {setKit(){},intro(){}};
          const vs='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
          const fs=`precision mediump float;uniform vec2 r;uniform float t;uniform float k;uniform vec3 tint;uniform vec2 m;
          vec3 pal(float x){return .5+.5*cos(6.2831*(x+vec3(.0,.33,.67)));}
          float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
          float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
          float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
          void main(){vec2 uv=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);
            float ang=atan(uv.y,uv.x),rad=length(uv);float seg=6.2831/8.;float ka=mod(ang,seg);ka=abs(ka-seg*.5);vec2 kv=vec2(cos(ka),sin(ka))*rad;
            uv=mix(uv,kv,k);uv+=(m-.5)*.08;
            float tt=t*.06;vec2 q=vec2(fbm(uv*1.6+tt),fbm(uv*1.6-tt+3.1));vec2 w=vec2(fbm(uv*1.4+2.*q+vec2(1.7,9.2)+tt*1.3),fbm(uv*1.4+2.*q+vec2(8.3,2.8)-tt));
            float f=fbm(uv*1.2+2.2*w);
            vec3 col=pal(f*1.4+length(w)*.6+t*.025);
            col=mix(col,tint,.22);
            float bands=smoothstep(.0,.9,sin(f*18.+t*.4)*.5+.5)*.12;
            col*=.22+.75*pow(f,1.6)+bands;
            col*=mix(1.,1.6,k)*(1.-.45*smoothstep(.4,1.4,rad));
            gl_FragColor=vec4(col,1.);}`;
          const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.warn(gl.getShaderInfoLog(o));return o};
          const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
          const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
          const U=n=>gl.getUniformLocation(pr,n),ur=U('r'),ut=U('t'),uk=U('k'),uti=U('tint'),um=U('m');
          const SCALE=.42;function size(){const w=Math.ceil(innerWidth*SCALE),h=Math.ceil(innerHeight*SCALE);if(c.width!==w||c.height!==h){c.width=w;c.height=h;gl.viewport(0,0,w,h)}}
          const hex=s=>{s=s.replace('#','');return [0,2,4].map(i=>parseInt(s.substr(i,2),16)/255)};
          let tint=hex('#a855f7'),tintT=tint.slice(),kv=RM?0:1,kT=1,mx=.5,my=.5,mxT=.5,myT=.5,t0=performance.now(),vis=true;
          addEventListener('pointermove',e=>{mxT=e.clientX/innerWidth;myT=1-e.clientY/innerHeight},{passive:true});
          document.addEventListener('visibilitychange',()=>{vis=!document.hidden;if(vis)requestAnimationFrame(loop)});
          function draw(t){size();for(let i=0;i<3;i++)tint[i]+=(tintT[i]-tint[i])*.05;kv+=(kT-kv)*.035;mx+=(mxT-mx)*.05;my+=(myT-my)*.05;
            gl.uniform2f(ur,c.width,c.height);gl.uniform1f(ut,RM?12.:t);gl.uniform1f(uk,kv);gl.uniform3f(uti,...tint);gl.uniform2f(um,mx,my);gl.drawArrays(gl.TRIANGLES,0,3)}
          function loop(n){if(!vis)return;draw((n-t0)/1000+ (1-kv)*0);if(!RM)requestAnimationFrame(loop)}
          if(RM){kv=0;kT=0;draw(12);addEventListener('resize',()=>draw(12))}else requestAnimationFrame(loop);
          return {setKit(h){tintT=hex(h);if(RM)draw(12)},intro(on){kT=on?1:0}}})();
        // holo layers on every panel
        function holo(){document.querySelectorAll('.hud:not(#header)').forEach(h=>{if(h.querySelector(':scope>.foil'))return;h.insertAdjacentHTML('afterbegin','<div class="foil"></div><div class="holo-edge"></div>')})}
        // wavy displacement on page enter
        function wave(){if(RM)return;const c=document.querySelector('#main .cyber-border.enter');const d=document.getElementById('wdisp');if(!c||!d)return;c.style.filter='url(#wave)';const t0=performance.now();
          const f=t=>{const p=Math.min(1,(t-t0)/650),e=Math.pow(1-p,3);d.setAttribute('scale',(60*e).toFixed(1));if(p<1)requestAnimationFrame(f);else c.style.filter=''};requestAnimationFrame(f)}
        state.dir='next';
        render();after();
        if(RM){endBoot()}else{document.getElementById('boot').addEventListener('click',endBoot);setTimeout(endBoot,2100)}

    </script>
